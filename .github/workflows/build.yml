name: Build back & front

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker-app dependencies
        run: npm ci
        working-directory: worker-app

      - name: Build backend (nx build back-app)
        run: npm run build:back

      - name: Build frontend (ng build)
        run: npm run build:front
